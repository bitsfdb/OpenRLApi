[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openrlapi"
version = "2.0.0"
description = "High-performance open-source Rocket League metadata, localized catalogs, titles, and thumbnails API"
readme = "README.md"
authors = [{ name = "VelocityRL Community" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "cryptography>=42.0.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
openrlapi = "openrlapi.cli:main"
